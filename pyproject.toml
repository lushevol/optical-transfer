[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "optical-transfer"
version = "0.1.0"
description = "CLI optical transfer tool"
requires-python = ">=3.12"

[project.scripts]
optical-transfer = "optical_transfer.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
