[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlasx"
version = "0.1.0"
description = "CLI QR transfer tool"
requires-python = ">=3.9"
dependencies = [
    "cryptography",
    "numpy",
    "Pillow",
    "qrcode[pil]",
]

[project.optional-dependencies]
bar = [
    "opencv-python",
]

[project.scripts]
atlasx = "atlasx.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
